[tox]
minversion = 4.6.0
envlist = py3,pep8

[testenv]
usedevelop = true
deps =
    -r{toxinidir}/test-requirements.txt
    .[sphinx]
commands =
    stestr run --slowest --suppress-attachments {posargs}

[testenv:cover]
setenv =
   PYTHON=coverage run --source reno --parallel-mode
commands =
   stestr run {posargs}
   coverage combine
   coverage html -d cover
   coverage xml -o cover/coverage.xml

[testenv:venv]
commands = {posargs}

[testenv:debug]
commands = oslo_debug_helper {posargs}

[testenv:docs]
commands = sphinx-build -a -W -E -b html doc/source doc/build/html

[testenv:releasenotes]
commands = sphinx-build -a -W -E -b html releasenotes/source releasenotes/build/html

[testenv:pep8]
deps =
    pre-commit
commands =
    pre-commit run -a
    reno -q lint

[flake8]
# We only enable the hacking (H) checks
select = H
builtins = _
exclude = .venv,.git,.tox,dist,doc,*lib/python*,*egg,build
